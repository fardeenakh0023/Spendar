<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account – Spendar</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="auth-wrap">
    <form id="registerForm" class="card auth-card" novalidate>
      <h1>Create your account</h1>
      <p class="muted">It takes under a minute.</p>
      <div id="formError" class="form-error hidden" role="alert"></div>
      <div class="field"><label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
        <span class="hint">3-30 characters: letters, numbers, dot, dash, underscore.</span></div>
      <div class="field"><label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required>
        <span class="hint">At least 8 characters.</span></div>
      <div class="field"><label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required></div>
      <button type="submit" class="btn btn-primary">Create account</button>
      <p class="auth-foot">Already registered? <a href="login.html">Log in</a></p>
    </form>
  </main>
  <script type="module">
    import { initRegister } from './js/auth.js';
    initRegister();
  </script>
</body>
</html>
